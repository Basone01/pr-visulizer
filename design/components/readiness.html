<!-- @dsCard group="Components" name="Readiness chips" subtitle="reviewed-deps ÷ total-deps — drives "best next"" viewport="640x360" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Readiness chips</title>
<style>
:root {
  --bg: #f6f8fa;
  --panel: #ffffff;
  --text: #1f2328;
  --muted: #656d76;
  --border: #d0d7de;
  --code-bg: #eaeef2;
  --accent: #0969da;
  --accent-soft: #ddf4ff;
  --added: #1a7f37;
  --added-soft: #e6ffec;
  --modified: #9a6700;
  --modified-soft: #fff8c5;
  --deleted: #cf222e;
  --deleted-soft: #ffebe9;
  --reviewed: #8c959f;
  --syn-keyword: #cf222e;
  --syn-string: #0a3069;
  --syn-func: #8250df;
  --syn-type: #953800;
  --syn-const: #0550ae;
  --syn-comment: #6e7781;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #21222c;
  --panel: #282a36;
  --text: #f8f8f2;
  --muted: #96a0c6;
  --border: #44475a;
  --code-bg: #343746;
  --accent: #bd93f9;
  --accent-soft: #322c4a;
  --added: #50fa7b;
  --added-soft: #1b3326;
  --modified: #ffb86c;
  --modified-soft: #3a2c1a;
  --deleted: #ff5555;
  --deleted-soft: #3b1d22;
  --reviewed: #565f7d;
  --syn-keyword: #ff79c6;
  --syn-string: #f1fa8c;
  --syn-func: #50fa7b;
  --syn-type: #8be9fd;
  --syn-const: #bd93f9;
  --syn-comment: #6272a4;
} }
:root[data-theme="light"] {
  --bg: #f6f8fa;
  --panel: #ffffff;
  --text: #1f2328;
  --muted: #656d76;
  --border: #d0d7de;
  --code-bg: #eaeef2;
  --accent: #0969da;
  --accent-soft: #ddf4ff;
  --added: #1a7f37;
  --added-soft: #e6ffec;
  --modified: #9a6700;
  --modified-soft: #fff8c5;
  --deleted: #cf222e;
  --deleted-soft: #ffebe9;
  --reviewed: #8c959f;
  --syn-keyword: #cf222e;
  --syn-string: #0a3069;
  --syn-func: #8250df;
  --syn-type: #953800;
  --syn-const: #0550ae;
  --syn-comment: #6e7781;
}
:root[data-theme="dark"] {
  --bg: #21222c;
  --panel: #282a36;
  --text: #f8f8f2;
  --muted: #96a0c6;
  --border: #44475a;
  --code-bg: #343746;
  --accent: #bd93f9;
  --accent-soft: #322c4a;
  --added: #50fa7b;
  --added-soft: #1b3326;
  --modified: #ffb86c;
  --modified-soft: #3a2c1a;
  --deleted: #ff5555;
  --deleted-soft: #3b1d22;
  --reviewed: #565f7d;
  --syn-keyword: #ff79c6;
  --syn-string: #f1fa8c;
  --syn-func: #50fa7b;
  --syn-type: #8be9fd;
  --syn-const: #bd93f9;
  --syn-comment: #6272a4;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
h4 { margin: 0 0 10px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.symlink { text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; }

.list { display: flex; flex-direction: column; gap: 10px; max-width: 420px; }
.rc { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
.rc.next { border-color: var(--accent); background: var(--accent-soft); }
.bar { flex: 1; height: 6px; border-radius: 3px; background: var(--code-bg); overflow: hidden; display: block; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.val { font-variant-numeric: tabular-nums; font-size: 12px; width: 68px; text-align: right; }
.rc.done .bar span { background: var(--reviewed); }
.cap { color: var(--muted); font-size: 12px; margin-top: 12px; max-width: 460px; }</style></head>
<body>

<div class="list">
  
<div class="rc next"><span class="bar"><span style="width:100%"></span></span><span class="mono val">1.00 👉 next</span></div>
  
<div class="rc "><span class="bar"><span style="width:100%"></span></span><span class="mono val">1.00</span></div>
  
<div class="rc "><span class="bar"><span style="width:67%"></span></span><span class="mono val">0.67</span></div>
  
<div class="rc "><span class="bar"><span style="width:33%"></span></span><span class="mono val">0.33</span></div>
  
<div class="rc "><span class="bar"><span style="width:0%"></span></span><span class="mono val">0.00</span></div>
  
<div class="rc done"><span class="bar"><span style="width:100%"></span></span><span class="mono val">✓ reviewed</span></div>
</div>
<p class="cap">1.00 = every changed file this one depends on is already reviewed — full context right now. Ties break by lower topo level, then higher fan-in. The suggestion guides, never blocks.</p>
</body></html>
