<!-- @dsCard group="Components" name="Readiness chips" subtitle="reviewed-deps ÷ total-deps — drives "best next"" viewport="640x360" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Readiness chips</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --panel: #ffffff;
        --text: #1c2430;
        --muted: #66707d;
        --border: #dde2e8;
        --code-bg: #eef1f5;
        --accent: #2563eb;
        --accent-soft: #dbeafe;
        --added: #16a34a;
        --added-soft: #dcfce7;
        --modified: #d97706;
        --modified-soft: #fef3c7;
        --deleted: #dc2626;
        --deleted-soft: #fee2e2;
        --reviewed: #9aa4b0;
        --syn-keyword: #cf222e;
        --syn-string: #0a3069;
        --syn-func: #8250df;
        --syn-type: #953800;
        --syn-const: #0550ae;
        --syn-comment: #6e7781;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12161c;
          --panel: #1a2029;
          --text: #e5eaf0;
          --muted: #8b96a5;
          --border: #2a323d;
          --code-bg: #232b36;
          --accent: #60a5fa;
          --accent-soft: #1e3a5f;
          --added: #4ade80;
          --added-soft: #14351f;
          --modified: #fbbf24;
          --modified-soft: #3a2e0e;
          --deleted: #f87171;
          --deleted-soft: #3b1a1a;
          --reviewed: #566172;
          --syn-keyword: #ff7b72;
          --syn-string: #a5d6ff;
          --syn-func: #d2a8ff;
          --syn-type: #ffa657;
          --syn-const: #79c0ff;
          --syn-comment: #8b949e;
        }
      }
      :root[data-theme="light"] {
        --bg: #f6f7f9;
        --panel: #ffffff;
        --text: #1c2430;
        --muted: #66707d;
        --border: #dde2e8;
        --code-bg: #eef1f5;
        --accent: #2563eb;
        --accent-soft: #dbeafe;
        --added: #16a34a;
        --added-soft: #dcfce7;
        --modified: #d97706;
        --modified-soft: #fef3c7;
        --deleted: #dc2626;
        --deleted-soft: #fee2e2;
        --reviewed: #9aa4b0;
        --syn-keyword: #cf222e;
        --syn-string: #0a3069;
        --syn-func: #8250df;
        --syn-type: #953800;
        --syn-const: #0550ae;
        --syn-comment: #6e7781;
      }
      :root[data-theme="dark"] {
        --bg: #12161c;
        --panel: #1a2029;
        --text: #e5eaf0;
        --muted: #8b96a5;
        --border: #2a323d;
        --code-bg: #232b36;
        --accent: #60a5fa;
        --accent-soft: #1e3a5f;
        --added: #4ade80;
        --added-soft: #14351f;
        --modified: #fbbf24;
        --modified-soft: #3a2e0e;
        --deleted: #f87171;
        --deleted-soft: #3b1a1a;
        --reviewed: #566172;
        --syn-keyword: #ff7b72;
        --syn-string: #a5d6ff;
        --syn-func: #d2a8ff;
        --syn-type: #ffa657;
        --syn-const: #79c0ff;
        --syn-comment: #8b949e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 -apple-system,
          "SF Pro Text",
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      .mono {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }
      h4 {
        margin: 0 0 10px;
        font-size: 13px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .symlink {
        text-decoration: underline dotted;
        text-underline-offset: 3px;
        cursor: pointer;
      }

      .list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 420px;
      }
      .rc {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 12px;
      }
      .rc.next {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .bar {
        flex: 1;
        height: 6px;
        border-radius: 3px;
        background: var(--code-bg);
        overflow: hidden;
        display: block;
      }
      .bar span {
        display: block;
        height: 100%;
        background: var(--accent);
        border-radius: 3px;
      }
      .val {
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        width: 68px;
        text-align: right;
      }
      .rc.done .bar span {
        background: var(--reviewed);
      }
      .cap {
        color: var(--muted);
        font-size: 12px;
        margin-top: 12px;
        max-width: 460px;
      }
    </style>
  </head>
  <body>
    <div class="list">
      <div class="rc next">
        <span class="bar"><span style="width: 100%"></span></span
        ><span class="mono val">1.00 👉 next</span>
      </div>

      <div class="rc">
        <span class="bar"><span style="width: 100%"></span></span><span class="mono val">1.00</span>
      </div>

      <div class="rc">
        <span class="bar"><span style="width: 67%"></span></span><span class="mono val">0.67</span>
      </div>

      <div class="rc">
        <span class="bar"><span style="width: 33%"></span></span><span class="mono val">0.33</span>
      </div>

      <div class="rc">
        <span class="bar"><span style="width: 0%"></span></span><span class="mono val">0.00</span>
      </div>

      <div class="rc done">
        <span class="bar"><span style="width: 100%"></span></span
        ><span class="mono val">✓ reviewed</span>
      </div>
    </div>
    <p class="cap">
      1.00 = every changed file this one depends on is already reviewed — full context right now.
      Ties break by lower topo level, then higher fan-in. The suggestion guides, never blocks.
    </p>
  </body>
</html>
