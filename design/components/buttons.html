<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Buttons & verdicts</title>
<style>

  --muted: #66707d;
  --border: #dde2e8;
  --code-bg: #eef1f5;
  --accent: #2563eb;
  --accent-soft: #dbeafe;

  --added-soft: #dcfce7;
  --modified: #d97706;

  --deleted: #dc2626;

  --reviewed: #9aa4b0;
  --syn-keyword: #cf222e;
  --syn-string: #0a3069;

  --syn-type: #953800;
  --syn-const: #0550ae;
  --syn-comment: #6e7781;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #12161c;
  --panel: #1a2029;
  --text: #e5eaf0;
  --muted: #8b96a5;
  --border: #2a323d;
  --code-bg: #232b36;
  --accent: #60a5fa;
  --accent-soft: #1e3a5f;
  --added: #4ade80;
  --added-soft: #14351f;
  --modified: #fbbf24;
  --modified-soft: #3a2e0e;
  --deleted: #f87171;
  --deleted-soft: #3b1a1a;
  --reviewed: #566172;
  --syn-keyword: #ff7b72;
  --syn-string: #a5d6ff;
  --syn-func: #d2a8ff;
  --syn-type: #ffa657;
  --syn-const: #79c0ff;
  --syn-comment: #8b949e;
} }
:root[data-theme="light"] {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --text: #1c2430;
  --muted: #66707d;
  --border: #dde2e8;
  --code-bg: #eef1f5;
  --accent: #2563eb;
  --accent-soft: #dbeafe;
  --added: #16a34a;
  --added-soft: #dcfce7;
  --modified: #d97706;
  --modified-soft: #fef3c7;
  --deleted: #dc2626;
  --deleted-soft: #fee2e2;
  --reviewed: #9aa4b0;
  --syn-keyword: #cf222e;
  --syn-string: #0a3069;
  --syn-func: #8250df;
  --syn-type: #953800;
  --syn-const: #0550ae;
  --syn-comment: #6e7781;
}
:root[data-theme="dark"] {
  --bg: #12161c;
  --panel: #1a2029;
  --text: #e5eaf0;
  --muted: #8b96a5;
  --border: #2a323d;
  --code-bg: #232b36;
  --accent: #60a5fa;
  --accent-soft: #1e3a5f;
  --added: #4ade80;
  --added-soft: #14351f;
  --modified: #fbbf24;
  --modified-soft: #3a2e0e;
  --deleted: #f87171;
  --deleted-soft: #3b1a1a;
  --reviewed: #566172;
  --syn-keyword: #ff7b72;
  --syn-string: #a5d6ff;
  --syn-func: #d2a8ff;
  --syn-type: #ffa657;
  --syn-const: #79c0ff;
  --syn-comment: #8b949e;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
h4 { margin: 0 0 10px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.symlink { text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; }

.row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.btn { border-radius: 8px; padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.approve { background: var(--added); border-color: var(--added); color: #fff; }
.btn.reject { background: var(--deleted); border-color: var(--deleted); color: #fff; }
.btn[disabled] { opacity: .4; cursor: default; }</style></head>
<body>

<h4>Actions</h4>
<div class="row"><button class="btn primary">Open next file</button><button class="btn">Deepen analysis 🔬</button><button class="btn" disabled>Submit review</button></div>
<h4>Verdict (one required at submit)</h4>
<div class="row"><button class="btn approve">✓ Approve</button><button class="btn">💬 Comment</button><button class="btn reject">✗ Request changes</button></div>
<p style="color:var(--muted);font-size:12px">Verdict colors reuse diff-status tokens: approve = added-green, request-changes = deleted-red. No new hues.</p>
</body></html>
